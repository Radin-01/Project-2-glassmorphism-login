<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 2 | Login page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="right">
            <div class="right-info">
                <h2>Welcom</h2>
                <p>Today is a new day.it's your day. <br>Login and manage your projects</p>


                <form action="">
                    <label for="email">Email</label>
                    <input type="email" placeholder="Example@gmail.com" required>


                    <label for="password">Password</label>
                    <input type="password" placeholder="At least 8 characters" required>

                    <a href="" class="forgot-password">Forgot your password ?</a>
                    <button type="submit" class="btn">Enter</button>
                </form>
                <p class="or-text">or</p>
                <div class="social-buttons">
                    <button>
                        <img src="./images/Google icon.png" width="20" alt="">
                        <span class="span">sign in with Google</span>
                        <span class="span-sm">Google</span>
                    </button>
                    <button>
                        <img src="./images/facebook icon.png" width="20" alt="">
                        <span class="span">sign in with facebook</span>
                        <span class="span-sm">facebook</span>
                    </button>
                </div>
                <p class="signup-text">
                    Don't have an account ? <a href="">Sign up</a>
                </p>
            </div>
        </div>
        <!--<div class="left">
            <img src="./images/image.png" width="1000" height="1000" alt="">
        </div>-->
    </div>
</body>
</html>
